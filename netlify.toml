# Netlify configuration — deploys the SababaKids React frontend.
# NOTE: The FastAPI backend + MongoDB are NOT hosted by Netlify.
# The backend runs on Render (free) — see render.yaml and DEPLOIEMENT.md.
# Set REACT_APP_BACKEND_URL (e.g. https://sababakids-api.onrender.com) in
# Netlify → Site configuration → Environment variables, then redeploy.

[build]
  base = "frontend"
  command = "yarn build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"

# SPA fallback so client-side routes resolve to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
