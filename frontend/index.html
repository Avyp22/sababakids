        <script>
            // Apply saved language/theme before React loads to avoid a flash.
            (function () {
                try {
                    var l = localStorage.getItem("sababakids_lang");
                    if (!l) { var n = (navigator.language || "he").slice(0, 2); l = n === "fr" || n === "en" ? n : "he"; }
                    document.documentElement.lang = l;
                    document.documentElement.dir = l === "he" ? "rtl" : "ltr";
                    var th = localStorage.getItem("sababakids_theme");
                    if (th === "dark" || (!th && window.matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
                } catch (e) {}
            })();
        </script>
