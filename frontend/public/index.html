<!doctype html>
<html lang="he" dir="rtl">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#E05A47" />
        <title>SababaKids — activités et événements pour enfants en Israël</title>
        <meta name="description" content="Parcs, plages, musées, zoos et spectacles pour enfants près de chez vous en Israël. פעילויות ואירועים לילדים לידכם. Kid-friendly outings near you in Israel." />

        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.json" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="SababaKids" />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="SababaKids" />
        <meta property="og:title" content="SababaKids — sorties en famille en Israël" />
        <meta property="og:description" content="Parcs, plages, musées et événements pour enfants près de chez vous. פעילויות לילדים בכל הארץ." />
        <meta property="og:url" content="https://sababakids.onrender.com/" />
        <meta property="og:image" content="https://sababakids.onrender.com/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://sababakids-api.onrender.com" crossorigin />
        <script>
            // Apply saved language/theme before React loads to avoid a flash.
            (function () {
                try {
                    var l = localStorage.getItem("sababakids_lang");
                    if (!l) { var n = (navigator.language || "he").slice(0, 2); l = n === "fr" || n === "en" ? n : "he"; }
                    document.documentElement.lang = l;
                    document.documentElement.dir = l === "he" ? "rtl" : "ltr";
                    var th = localStorage.getItem("sababakids_theme");
                    if (th === "dark" || (!th && window.matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <noscript>SababaKids needs JavaScript to run.</noscript>
        <div id="root"></div>
    </body>
</html>
