# Pings the Render free backend every 14 minutes so it doesn't fall asleep
# (free instances sleep after 15 min idle → ~50s cold start).
# Set the repo variable BACKEND_URL (Settings → Secrets and variables → Actions → Variables).
name: keep-backend-awake

on:
  schedule:
    - cron: "*/14 5-22 * * *"   # 05:00–22:59 UTC ≈ daytime in Israel
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.BACKEND_URL != '' }}
    steps:
      - run: curl -fsS --retry 3 --max-time 90 "${{ vars.BACKEND_URL }}/api/health"
